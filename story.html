let HOLDT = null;
let CLK0 = performance.now();

window.__dfTOTAL = TOTAL;
window.__dfT = function(now){
  return HOLDT !== null ? HOLDT : ((now - CLK0) / 1000) % TOTAL;
};
window.__dfScrub = function(sec){
  HOLDT = Math.max(0, Math.min(TOTAL - 0.01, sec));
};
window.__dfRelease = function(){
  if(HOLDT !== null){
    CLK0 = performance.now() - HOLDT * 1000;
    HOLDT = null;
  }
};
window.__dfSeekBy = function(d){
  const T = window.__dfT(performance.now());
  const n = (((T + d) % TOTAL) + TOTAL) % TOTAL;
  if(HOLDT !== null) HOLDT = n;
  else CLK0 = performance.now() - n * 1000;
  if(window.__dfAudioSync) window.__dfAudioSync();
};

/* Language switching function */
window.__dfSetLanguage = function(langKey){
  if(!LANG_CONFIG[langKey] || langKey === currentLang) return;
  const oldCfg = currentCfg;
  const T = window.__dfT(performance.now());
  const progressRatio = Math.max(0, Math.min(1, T / (oldCfg.total || 1)));

  currentLang = langKey;
  currentCfg = LANG_CONFIG[currentLang];
  TS = currentCfg.ts;
  TOTAL = currentCfg.total;
  DURA = currentCfg.dura;
  window.__dfTOTAL = TOTAL;

  const newTime = progressRatio * TOTAL;
  if(HOLDT !== null) HOLDT = newTime;
  else CLK0 = performance.now() - newTime * 1000;

  try {
    const u = new URL(window.location.href);
    u.searchParams.set('lang', currentLang);
    window.history.replaceState({}, '', u.toString());
  } catch(e){}

  if(window.__dfSwitchVoice) window.__dfSwitchVoice(currentLang, newTime);
  updateActiveLangPills();
  updateCaption(newTime);
};

  document.querySelectorAll('.story-lang-btn').forEach(btn => {

function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = ('0' + (sec % 60)).slice(-2);
  return `${m}:${s}`;
}

}

/* ==========================================================================
   WEBGL DOTFIELD SCENE MORPHING ENGINE
   ========================================================================== */
(function(){
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', {alpha: false, antialias: false});
  let ready = false, imgs = [];

  const LX = -0.55, LY = -0.6, LZ = 0.58, RS = 0.09, RK = 0.5;
  const BN = 24, BD = 0.05;
  const DUR = 1.7, STAG = 0.45, ENTER = 2.2;

  const VS = 'precision highp float;attribute vec2 a_f,a_t;attribute vec3 a_fc,a_tc;attribute vec4 a_r;'
    + 'uniform float u_tt,u_dur,u_time,u_k,u_rs,u_dpr,u_zoom;uniform vec2 u_off,u_view;varying vec3 v_c;varying float v_r,v_sz;'
    + 'float eio(float t){return t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)/2.;}'
    + 'void main(){float lt=clamp((u_tt-a_r.x*' + STAG + '*u_dur)/u_dur,0.,1.);float u=eio(lt);'
    + 'float sw=sin(3.14159265*lt)*a_r.y*3.2*u_k;'
    + 'vec2 p=mix(a_f,a_t,u)+vec2(sw*.7,-sw);'
    + 'p+=vec2(sin(u_time*2.+a_r.z*60.),cos(u_time*1.7+a_r.z*80.))*.12*u_k;'
    + 'p=u_view*.5+((p+u_off)-u_view*.5)*u_zoom;'
    + 'v_c=mix(a_fc,a_tc,u);float r=(.75+a_r.w*.2)*u_rs*u_zoom*u_dpr;'
    + 'gl_Position=vec4(p.x/u_view.x*2.-1.,1.-p.y/u_view.y*2.,0.,1.);v_r=r;v_sz=2.*r+2.;gl_PointSize=v_sz;}';

  const FS = 'precision mediump float;varying vec3 v_c;varying float v_r,v_sz;'
    + 'void main(){float d=length(gl_PointCoord-.5)*v_sz;float a=clamp(v_r-d+.5,0.,1.);if(a<.01)discard;gl_FragColor=vec4(v_c*a,a);}';

  const AVS = 'precision highp float;attribute vec3 a_o;uniform float u_time,u_dpr;uniform vec2 u_view;varying float v_a;'
    + 'void main(){float R=max(u_view.x,u_view.y)*.62*a_o.y;float ang=a_o.x*6.28318+u_time*(.06+a_o.z*.1)*(a_o.z>.5?1.:-1.);'
    + 'vec2 p=u_view*.5+vec2(cos(ang)*R*1.15,sin(ang)*R*.8);v_a=.1+.12*a_o.y;'
    + 'gl_Position=vec4(p.x/u_view.x*2.-1.,1.-p.y/u_view.y*2.,0.,1.);gl_PointSize=2.*u_dpr+1.;}';

  const AFS = 'precision mediump float;varying float v_a;void main(){float d=length(gl_PointCoord-.5)*2.;float a=clamp(1.-d,0.,1.)*v_a;gl_FragColor=vec4(vec3(1.,.82,.5)*a,1.);}';

  function sh(t, s){
    const o = gl.createShader(t);
    gl.shaderSource(o, s);
    gl.compileShader(o);
    return o;
  }
  function prog(v, f){
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, v));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f));
    gl.linkProgram(p);
    return p;
  }

  let pr, apr, A = {}, U = {}, AA = {}, AU = {};
  if(gl){
    pr = prog(VS, FS);
    apr = prog(AVS, AFS);
    ['a_f','a_fc','a_t','a_tc','a_r'].forEach(n => { A[n] = gl.getAttribLocation(pr, n); });
    ['u_tt','u_dur','u_time','u_k','u_rs','u_dpr','u_zoom','u_off','u_view'].forEach(n => { U[n] = gl.getUniformLocation(pr, n); });
    AA.a_o = gl.getAttribLocation(apr, 'a_o');
    ['u_time','u_dpr','u_view'].forEach(n => { AU[n] = gl.getUniformLocation(apr, n); });
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.clearColor(0.02, 0.02, 0.02, 1);
  }

  let W = 0, H = 0, P = 0, R = 0, NT = 0, dpr = 1, k = 1, rs = 1;
  let bufs = [], scatter = null, rndBuf = null, ambBuf = null, NA = 0;
  let from = null, to = null, timer = 0, lastP = 0;

  function mk(a){
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, a, gl.STATIC_DRAW);
    return b;
  }
  function rnd(){ return Math.random(); }

  function samplePts(img){
    const o = document.createElement('canvas');
    o.width = o.height = R;
    const g = o.getContext('2d', {willReadFrequently: true});
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, R, R);
    const d = g.getImageData(0, 0, R, R).data;
    const n = R * R;
    const lm = new Float32Array(n), w = new Float32Array(n), shv = new Float32Array(n);
    let tot = 0;

    for(let i = 0; i < n; i++){
      lm[i] = (d[i*4]*0.3 + d[i*4+1]*0.59 + d[i*4+2]*0.11) / 255;
    }

    for(let y = 0; y < R; y++){
      for(let x = 0; x < R; x++){
        let e = 0;
        if(x >= 2 && y >= 2 && x < R-2 && y < R-2){
          const gx = lm[y*R+x+2] - lm[y*R+x-2];
          const gy = lm[(y+2)*R+x] - lm[(y-2)*R+x];
          e = Math.min(1, Math.sqrt(gx*gx + gy*gy) * 3.6);
        }
        let ww = 0.6 + 0.15 * lm[y*R+x] + 0.8 * e;
        const dx = x + 0.5 - R/2, dy = y + 0.5 - R/2;
        const dd = Math.sqrt(dx*dx + dy*dy);
        let fr = 1, sv = 1;

        if(dd > R/2 * 0.6){
          const rb = R/2 * (1 - BD * (1 - Math.abs(Math.cos(BN * Math.atan2(dy, dx) / 2))));
          const u = dd / rb;
          let sl = 0;
          if(u < 0.8) sl = -0.3 * u;
          else if(u < 0.95){
            const t1 = (u - 0.8) / 0.15;
            sl = 40 * t1 * (1 - t1);
          } else {
            const t2 = Math.min(1, (u - 0.95) / 0.05);
            sl = -120 * t2 * (1 - t2);
          }
          const tl = Math.max(-1.6, Math.min(1.6, RS * sl));
          const nx = -tl * dx / dd, ny = -tl * dy / dd;
          const dl = (nx * LX + ny * LY + LZ) / Math.sqrt(nx*nx + ny*ny + 1);
          sv = Math.max(0.72, Math.min(1.3, 1 + RK * (dl - LZ)));
          if(dd > R/2 * (1 - BD) - 3) fr = (rb - dd) / (R * 0.015);
        }

        ww *= Math.max(0, Math.min(1, fr));
        w[y*R+x] = ww;
        shv[y*R+x] = sv;
        tot += ww;
      }
    }

    const sc = NT / tot * 1.15;
    const cand = new Int32Array(Math.ceil(NT * 1.6));
    let c = 0;

    for(let i = 0; i < n && c < cand.length; i++){
      const v = w[i] * sc;
      const gn = (52.9829189 * ((0.06711056 * (i % R) + 0.00583715 * Math.floor(i / R)) % 1)) % 1;
      let m = Math.floor(v + gn);
      while(m-- > 0 && c < cand.length) cand[c++] = i;
    }

    for(let i = c - 1; i > 0; i--){
      const j = Math.floor(rnd() * (i + 1));
      const tt = cand[i];
      cand[i] = cand[j];
      cand[j] = tt;
    }

    const out = new Float32Array(NT * 5);
    const s = P / R;
    for(let i = 0; i < NT; i++){
      const q = i < c ? cand[i] : cand[Math.floor(rnd() * Math.max(1, c))];
      const px = q % R, py = Math.floor(q / R);
      const o5 = i * 5;
      out[o5] = (px + rnd()) * s;
      out[o5 + 1] = (py + rnd()) * s;
      const l0 = lm[q];
      const cr = d[q*4]/255, cg = d[q*4+1]/255, cb = d[q*4+2]/255;
      out[o5 + 2] = Math.max(0, Math.min(1, (l0 + (cr - l0) * 1.08) * shv[q]));
      out[o5 + 3] = Math.max(0, Math.min(1, (l0 + (cg - l0) * 1.08) * shv[q]));
      out[o5 + 4] = Math.max(0, Math.min(1, (l0 + (cb - l0) * 1.08) * shv[q]));
    }
    return out;
  }

  function build(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    P = Math.round(Math.min(W, H) * 0.80);
    lastP = P;

    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    gl.viewport(0, 0, cv.width, cv.height);

    R = Math.min(960, Math.round(P * dpr));
    const cap = (/Mobi|Android|iPhone|iPad/.test(navigator.userAgent) || (navigator.hardwareConcurrency || 4) <= 4) ? 190000 : 360000;
    NT = Math.max(60000, Math.min(cap, Math.round(P * P / 2.0)));
    k = P / 650;
    rs = P * Math.sqrt(1.6 / (4 * NT)) / 0.85;

    bufs.forEach(b => gl.deleteBuffer(b));
    bufs = imgs.map(im => mk(samplePts(im)));

    const first = new Float32Array(NT * 5);
    const rn = new Float32Array(NT * 4);
    const src0 = samplePts(imgs[0]);

    for(let i = 0; i < NT; i++){
      const ra = P * 0.8 * Math.sqrt(rnd());
      const an = rnd() * 6.28318;
      first[i*5] = P/2 + Math.cos(an) * ra;
      first[i*5 + 1] = P/2 + Math.sin(an) * ra;
      first[i*5 + 2] = src0[i*5 + 2];
      first[i*5 + 3] = src0[i*5 + 3];
      first[i*5 + 4] = src0[i*5 + 4];
      rn[i*4] = (i % 50) / 50;
      rn[i*4 + 1] = (i % 13) - 6;
      rn[i*4 + 2] = rnd();
      rn[i*4 + 3] = i % 4;
    }

    scatter = mk(first);
    rndBuf = mk(rn);

    NA = Math.round(Math.min(4000, W * H / 700));
    const am = new Float32Array(NA * 3);
    for(let i = 0; i < NA * 3; i++) am[i] = rnd();
    ambBuf = mk(am);
  }

  function bindMain(f, t){
    gl.bindBuffer(gl.ARRAY_BUFFER, f);
    gl.vertexAttribPointer(A.a_f, 2, gl.FLOAT, false, 20, 0);
    gl.vertexAttribPointer(A.a_fc, 3, gl.FLOAT, false, 20, 8);
    gl.bindBuffer(gl.ARRAY_BUFFER, t);
    gl.vertexAttribPointer(A.a_t, 2, gl.FLOAT, false, 20, 0);
    gl.vertexAttribPointer(A.a_tc, 3, gl.FLOAT, false, 20, 8);
    gl.bindBuffer(gl.ARRAY_BUFFER, rndBuf);
    gl.vertexAttribPointer(A.a_r, 4, gl.FLOAT, false, 16, 0);
  }

  function frame(now){
    requestAnimationFrame(frame);
    if(!ready) return;

    const T = window.__dfT(now);
    let dur = DUR, si = 0, N = bufs.length;
    for(let q = 0; q < N && q < TS.length; q++){
      if(TS[q] <= T) si = q;
    }
    const ts = T - TS[si];

    if(si === 0){
      from = scatter;
      to = bufs[0];
      dur = ENTER;
      if(ts >= ENTER * (1 + STAG)){
        from = to = bufs[0];
      }
    } else {
      from = bufs[si - 1];
      to = bufs[si];
      dur = DUR;
      if(ts >= DUR * (1 + STAG)){
        from = to = bufs[si];
      }
    }

    updateCaption(T);

    const time = now / 1000;
    gl.clear(gl.COLOR_BUFFER_BIT);

    /* Ambient drifting sacred dots */
    gl.useProgram(apr);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.disableVertexAttribArray(A.a_f);
    gl.bindBuffer(gl.ARRAY_BUFFER, ambBuf);
    gl.enableVertexAttribArray(AA.a_o);
    gl.vertexAttribPointer(AA.a_o, 3, gl.FLOAT, false, 12, 0);
    gl.uniform1f(AU.u_time, time);
    gl.uniform1f(AU.u_dpr, dpr);
    gl.uniform2f(AU.u_view, W, H);
    gl.drawArrays(gl.POINTS, 0, NA);
    gl.disableVertexAttribArray(AA.a_o);

    /* Main morphing dot portrait */
    gl.useProgram(pr);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    for(const n in A) gl.enableVertexAttribArray(A[n]);
    bindMain(from, to);
    gl.uniform1f(U.u_tt, ts);
    gl.uniform1f(U.u_dur, dur);
    gl.uniform1f(U.u_time, time);
    gl.uniform1f(U.u_k, k);
    gl.uniform1f(U.u_rs, rs);
    gl.uniform1f(U.u_dpr, dpr);
    gl.uniform1f(U.u_zoom, 1 + 0.008 * Math.sin(time * 0.5));
    gl.uniform2f(U.u_off, (W - P)/2, (H - P)/2);
    gl.uniform2f(U.u_view, W, H);
    gl.drawArrays(gl.POINTS, 0, NT);
    for(const m in A) gl.disableVertexAttribArray(A[m]);
  }

  window.addEventListener('resize', () => {
    if(!ready) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const nw = cv.clientWidth, nh = cv.clientHeight;
      const np = Math.round(Math.min(nw, nh) * 0.80);
      if(Math.abs(np - lastP) / lastP < 0.03){
        W = nw; H = nh;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        gl.viewport(0, 0, cv.width, cv.height);
        return;
      }
      ready = false;
      build();
      ready = true;
    }, 250);
  });

  /* Asynchronously load all 26 scene JPEGs */
  let loadedCount = 0;
  const loadedImgs = [];
  SRC.forEach((u, i) => {
    const im = new Image();
    im.onload = () => {
      loadedImgs[i] = im;
      if(++loadedCount === SRC.length){
        imgs = loadedImgs;
        build();
        ready = true;
        CLK0 = performance.now();
        const loaderEl = document.getElementById('storyLoader');
        if(loaderEl) loaderEl.classList.add('done');
      }
    };
    im.src = u;
  });

  requestAnimationFrame(frame);
})();

/* ==========================================================================
   INTERACTIVE ROTATING TEXT RING & CIRCULAR PROGRESS SCRUBBER
   ========================================================================== */
(function(){
  const t = document.getElementById('t');
  const g = t.getContext('2d');
  if(!g) return;

  const MANTRA = "Hare Krishna Hare Krishna Krishna Krishna Hare Hare   •   Hare Rama Hare Rama Rama Rama Hare Hare   •   ";
  const FF = 'Georgia, "Times New Roman", serif';
  let rw = 0, rh = 0, dp = 1, rlf = 0;
  let cachedChars = [], cachedCenters = [], cachedC = 0;
  let drag = false, hov = false, pid = null, lastF = 0;
  const t0 = performance.now();

  function updateMetrics(f, C, R_ring){
    g.font = f + 'px ' + FF;
    let singleWid = [];
    let L_single = 0;
    for(let i = 0; i < MANTRA.length; i++){
      const w = g.measureText(MANTRA[i]).width + f * 0.04;
      singleWid.push(w);
      L_single += w;
    }

    const reps = Math.max(1, Math.round(C / L_single));
    const L_total = reps * L_single;
    const scale = C / L_total;

    cachedChars = [];
    cachedCenters = [];
    cachedC = C;

    let curr = 0;
    for(let r = 0; r < reps; r++){
      for(let i = 0; i < MANTRA.length; i++){
        const w = singleWid[i] * scale;
        cachedChars.push(MANTRA[i]);
        cachedCenters.push(curr + w / 2);
        curr += w;
      }
    }
  }

  function geo(e){
    const r = Math.min(rw, rh) || 1;
    const dx = e.clientX - rw / 2;
    const dy = e.clientY - rh / 2;
    return {
      d: Math.sqrt(dx*dx + dy*dy),
      r: r * 0.412,
      tol: Math.max(18, r * 0.035) * (e.pointerType === 'touch' ? 1.8 : 1),
      a: Math.atan2(dy, dx)
    };
  }

  function frac(e, prev){
    const q = geo(e);
    let f = ((((q.a + Math.PI / 2) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2);
    if(prev !== null && Math.abs(f - prev) > 0.5) f = prev > 0.5 ? 0.9999 : 0;
    return f;
  }

  function setT(f){
    if(window.__dfScrub) window.__dfScrub(f * (window.__dfTOTAL || 327));
  }

  window.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const q = geo(e);
    if(Math.abs(q.d - q.r) > q.tol) return;
    drag = true;
    pid = e.pointerId;
    window.__dfDrag = true;
    lastF = frac(e, null);
    setT(lastF);
    try { document.documentElement.setPointerCapture(e.pointerId); } catch(x){}
    document.documentElement.style.cursor = 'grabbing';
    e.preventDefault();
  }, {passive: false});

  window.addEventListener('pointermove', e => {
    if(drag){
      if(e.pointerId !== pid) return;
      lastF = frac(e, lastF);
      setT(lastF);
      e.preventDefault();
      return;
    }
    if(e.pointerType !== 'mouse') return;
    const q = geo(e);
    hov = Math.abs(q.d - q.r) <= q.tol;
    document.documentElement.style.cursor = hov ? 'grab' : 'default';
  }, {passive: false});

  function end(e){
    if(!drag || e.pointerId !== pid) return;
    drag = false;
    pid = null;
    window.__dfDrag = false;
    if(window.__dfRelease) window.__dfRelease();
    if(window.__dfAudioSync) window.__dfAudioSync();
    document.documentElement.style.cursor = hov ? 'grab' : 'default';
  }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight') window.__dfSeekBy(5);
    else if(e.key === 'ArrowLeft') window.__dfSeekBy(-5);
  });

  function loop(now){
    requestAnimationFrame(loop);
    const cw = t.clientWidth, chh = t.clientHeight;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    if(cw !== rw || chh !== rh || d !== dp){
      rw = cw; rh = chh; dp = d;
      t.width = Math.round(rw * dp);
      t.height = Math.round(rh * dp);
      rlf = 0;
    }
    const m = Math.min(rw, rh);
    if(!m) return;

    g.setTransform(dp, 0, 0, dp, 0, 0);
    g.clearRect(0, 0, rw, rh);

    const f = Math.max(12, Math.min(26, m * 0.030));
    const R_ring = m * 0.442;
    const C = Math.PI * 2 * R_ring;
    const rLoader = m * 0.412;
    const cx = rw / 2, cy = rh / 2;

    if(f !== rlf || Math.abs(C - cachedC) > 1){
      rlf = f;
      updateMetrics(f, C, R_ring);
    }

    const sec = (now - t0) / 1000;
    const a = Math.max(0, Math.min(1, (sec - 1.2) / 1.5));
    if(a <= 0) return;

    const Tn = window.__dfT ? window.__dfT(now) : 0;
    const TT = window.__dfTOTAL || 327;
    const fr = Math.max(0, Math.min(1, Tn / TT));
    const an = -Math.PI / 2 + fr * Math.PI * 2;
    const act = drag || hov;

    /* 1. Background faint guide track */
    g.save();
    g.lineCap = 'round';
    g.globalAlpha = a * 0.25;
    g.strokeStyle = '#f4daa0';
    g.lineWidth = act ? 3.5 : 2;
    g.beginPath();
    g.arc(cx, cy, rLoader, 0, Math.PI * 2);
    g.stroke();
    g.restore();

    /* 2. Active golden progress arc */
    if(fr > 0.001){
      g.save();
      g.lineCap = 'round';
      g.shadowColor = 'rgba(255, 215, 0, 0.9)';
      g.shadowBlur = act ? 14 : 7;
      g.strokeStyle = '#ffd700';
      g.lineWidth = act ? 5 : 3.5;
      g.globalAlpha = a * 0.95;
      g.beginPath();
      g.arc(cx, cy, rLoader, -Math.PI / 2, an);
      g.stroke();

      /* Inner specular highlight */
      g.shadowBlur = 0;
      g.strokeStyle = '#fffbe0';
      g.lineWidth = act ? 2 : 1.5;
      g.beginPath();
      g.arc(cx, cy, rLoader, -Math.PI / 2, an);
      g.stroke();
      g.restore();
    }

    /* 3. Glowing scrubber bead at leading head */
    g.save();
    g.shadowColor = '#fff3cf';
    g.shadowBlur = act ? 18 : 10;
    g.fillStyle = '#ffffff';
    g.globalAlpha = a;
    g.beginPath();
    g.arc(cx + Math.cos(an) * rLoader, cy + Math.sin(an) * rLoader, act ? 8 : 5.5, 0, Math.PI * 2);
    g.fill();
    g.restore();

    /* 4. Seamless Rotating Maha Mantra */
    if(cachedChars.length > 0){
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = '#f4daa0';

      const rotSpeed = f * 1.8;
      const off = sec * rotSpeed;

      for(let i = 0; i < cachedChars.length; i++){
        if(cachedChars[i] === ' ') continue;
        const pos = ((cachedCenters[i] + off) % C + C) % C;
        const th = -Math.PI / 2 + pos / R_ring;

        g.globalAlpha = a * 0.92;
        g.save();
        g.translate(cx + Math.cos(th) * R_ring, cy + Math.sin(th) * R_ring);
        g.rotate(th + Math.PI / 2);
        g.fillText(cachedChars[i], 0, 0);
        g.restore();
      }
    }

    /* 5. Tooltip while dragging */
    if(drag){
      g.save();
      const px = cx + Math.cos(an) * (rLoader - 38);
      const py = cy + Math.sin(an) * (rLoader - 38);
      const lb = fmtTime(Tn) + ' / ' + fmtTime(TT);
      const fz = Math.max(12, Math.min(18, m * 0.026));
      g.font = '600 ' + fz + 'px ' + FF;
      const pw = g.measureText(lb).width + 20, ph = fz + 12;

      g.globalAlpha = 0.9;
      g.fillStyle = '#0e0703';
      g.beginPath();
      if(g.roundRect) g.roundRect(px - pw/2, py - ph/2, pw, ph, ph/2);
      else g.rect(px - pw/2, py - ph/2, pw, ph);
      g.fill();

      g.strokeStyle = '#ffd700';
      g.lineWidth = 1;
      g.stroke();

      g.globalAlpha = 1;
      g.fillStyle = '#ffd700';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(lb, px, py + 1);
      g.restore();
    }
  }

  requestAnimationFrame(loop);
})();

/* ==========================================================================
   AUDIO ENGINE (VOICE NARRATION + SOOTHING KRISHNA FLUTE BGM)
   ========================================================================== */
(function(){
  /* Pre-instantiated dedicated audio objects for all 5 languages */
  const VOICES = {
    hi: new Audio('story/audio/story_hi.mp3'),
    en: new Audio('story/audio/story_en.mp3'),
    bn: new Audio('story/audio/story_bn.mp3'),
    or: new Audio('story/audio/story_or.mp3'),
    ru: new Audio('story/audio/story_ru.mp3')
  };

  Object.keys(VOICES).forEach(key => {
    const a = VOICES[key];
    a.preload = 'auto';
    a.loop = false;
    a.volume = 1.0;
  });

  let bgmAudio = new Audio('story/audio/story_bgm.mp3');
  bgmAudio.preload = 'auto';
  bgmAudio.loop = true;
  bgmAudio.volume = 0.22;

  let bgmEnabled = true;
  let voiceOk = false, armed = false;
  const EV = ['pointerdown', 'click', 'touchend', 'keydown'];

  function T(){
    return window.__dfT ? window.__dfT(performance.now()) : 0;
  }

  function getActiveVoice(){
    return VOICES[currentLang] || VOICES['hi'];
  }

  function pauseInactiveVoices(){
    Object.keys(VOICES).forEach(k => {
      if(k !== currentLang){
        const a = VOICES[k];
        if(!a.paused) a.pause();
      }
    });
  }

  function syncAndPlay(explicitTargetTime){
    pauseInactiveVoices();
    const currAudio = getActiveVoice();
    const t = (explicitTargetTime !== undefined && explicitTargetTime !== null) ? explicitTargetTime : T();

    if(t >= DURA){
      if(!currAudio.paused) currAudio.pause();
    } else {
      const applySeek = () => {
        try {
          if(currAudio.duration && !isNaN(currAudio.duration) && currAudio.readyState >= 1){
            if(Math.abs(currAudio.currentTime - t) > 0.45){
              currAudio.currentTime = Math.max(0, Math.min(currAudio.duration - 0.1, t));
            }
          }
        } catch(err){
          console.warn('Audio seek guard:', err);
        }
      };

      if(currAudio.readyState >= 1){
        applySeek();
      } else {
        const onMeta = () => {
          currAudio.removeEventListener('loadedmetadata', onMeta);
          currAudio.removeEventListener('canplay', onMeta);
          applySeek();
        };
        currAudio.addEventListener('loadedmetadata', onMeta, { once: true });
        currAudio.addEventListener('canplay', onMeta, { once: true });
      }

      const pv = currAudio.play();
      if(pv && pv.then){
        pv.then(() => { voiceOk = true; }).catch(armAudio);
      }
    }

    if(bgmEnabled){
      const pb = bgmAudio.play();
      if(pb && pb.catch) pb.catch(() => {});
    }
  }

  function armAudio(){
    if(armed) return;
    armed = true;
    EV.forEach(e => window.addEventListener(e, unlockAudio, true));
  }

  function unlockAudio(){
    EV.forEach(e => window.removeEventListener(e, unlockAudio, true));
    armed = false;
    syncAndPlay();
  }

  window.__dfAudioSync = function(){
    if(voiceOk) syncAndPlay();
  };

  window.__dfSwitchVoice = function(newLang, targetTime){
    try {
      pauseInactiveVoices();
      syncAndPlay(targetTime);
    } catch(e){
      console.warn('Switch voice error:', e);
    }
  };

  /* Periodic check to keep audio locked with visual timeline */
  setInterval(() => {
    if(window.__dfDrag){
      const active = getActiveVoice();
      if(!active.paused) active.pause();
      return;
    }
    const t = T();
    const active = getActiveVoice();
    if(t >= DURA){
      if(!active.paused) active.pause();
      return;
    }
    if(!voiceOk) return;
    if(active.paused || (active.readyState >= 1 && Math.abs(active.currentTime - t) > 0.8)){
      syncAndPlay();
    }
  }, 500);

  /* BGM Toggle Button */
  const btnBgm = document.getElementById('btnBgm');
  if(btnBgm){
    btnBgm.addEventListener('click', () => {
      bgmEnabled = !bgmEnabled;
      btnBgm.classList.toggle('active', bgmEnabled);
      if(bgmEnabled){
        btnBgm.innerHTML = '<span>🎵 Flute</span>';
        bgmAudio.play().catch(() => {});
      } else {
        btnBgm.innerHTML = '<span>🔇 Muted</span>';
        bgmAudio.pause();
      }
    });
  }

  function stopAllAudio(){
    try {
      Object.keys(VOICES).forEach(k => { VOICES[k].pause(); });
      bgmAudio.pause();
    } catch(e){}
  }

  /* Close Button (Notifies parent if inside iframe, or goes back) */
  const btnClose = document.getElementById('btnCloseStory');
  if(btnClose){
    btnClose.addEventListener('click', () => {
      stopAllAudio();
      try {
        if(window.parent && window.parent !== window){
          window.parent.postMessage({action: 'closeDamodaraStory'}, '*');
        } else {
          window.location.href = './';
        }
      } catch(e){
        window.location.href = './';
      }
    });
  }

  /* Listen for message from parent to pause audio */
  window.addEventListener('message', (e) => {
    if(e && e.data && e.data.action === 'pauseStoryAudio'){
      stopAllAudio();
    }
  });

  window.addEventListener('pagehide', stopAllAudio);
  window.addEventListener('beforeunload', stopAllAudio);

  /* Language Switcher Buttons */
  document.querySelectorAll('.story-lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const l = btn.getAttribute('data-lang');
      if(window.__dfSetLanguage) window.__dfSetLanguage(l);
    });
  });

  /* Start playback immediately */
  syncAndPlay();
})();
</script>
